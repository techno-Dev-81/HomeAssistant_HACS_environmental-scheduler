get_rooms:
  name: Get Rooms
  description: Returns all configured rooms with their IDs, names, and assigned persons.

get_active_block:
  name: Get Active Block
  description: >
    Returns the current target temperature and active block for a room,
    taking into account house mode (vacation/away) and person presence.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:

get_blocks:
  name: Get Blocks
  description: >
    Returns all scheduled blocks for a room or for the house schedule, optionally
    filtered by day. For a room that follows the house schedule, the house blocks
    are returned with following_house true unless schedule is 'room'.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room). Required unless schedule is 'house'.
      required: false
      example: living_room
      selector:
        text:
    schedule:
      name: Schedule
      description: >
        Which schedule to read. 'house' reads the house schedule (room is ignored).
        'room' reads the room's own stored blocks, even when the room follows the
        house schedule. If omitted, a room following the house schedule returns
        the house blocks.
      required: false
      example: room
      selector:
        select:
          options:
            - room
            - house
    day:
      name: Day
      description: Filter by day of week (returns full week if omitted)
      required: false
      example: monday
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

set_house_mode:
  name: Set House Mode
  description: >
    Sets the house-wide mode. 'normal' follows room schedules and person presence.
    'away' applies away temperatures to all rooms. 'vacation' applies frost
    protection temperature to all rooms regardless of schedules.
  fields:
    mode:
      name: Mode
      description: House mode to activate
      required: true
      example: away
      selector:
        select:
          options:
            - normal
            - away
            - vacation

set_vacation_mode:
  name: Set Vacation Mode
  description: >
    Convenience shortcut. Enabling sets house mode to 'vacation' (frost protection).
    Disabling sets house mode back to 'normal'.
  fields:
    enabled:
      name: Enabled
      description: true to enable vacation mode, false to return to normal
      required: true
      example: true
      selector:
        boolean:

get_upcoming_blocks:
  name: Get Upcoming Blocks
  description: >
    Returns the next scheduled blocks for a room starting from now, with pre-calculated
    preheat_start times. Used by Node-RED to schedule pre-heating actions.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of upcoming blocks to return (default 5, max 20)
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 20
          mode: box

set_preheat_offset:
  name: Set Preheat Offset
  description: >
    Sets the number of minutes before a block's start time that pre-heating should begin.
    Typically written back by Node-RED as it learns each room's heat-up time.
    Can also be set manually.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:
    offset_minutes:
      name: Offset (minutes)
      description: Minutes before block start to begin pre-heating (0–120)
      required: true
      example: 25
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: slider

commit_block:
  name: Commit Block
  description: >
    Creates or updates a block on a room or the house schedule. If the block
    overlaps existing blocks, nothing is saved and the conflicts are returned.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room). Required unless schedule is 'house'.
      required: false
      example: living_room
      selector:
        text:
    schedule:
      name: Schedule
      description: >
        Which schedule to edit. 'house' edits the house schedule (room is ignored).
        'room' edits the room's own stored blocks. On a room that follows the house
        schedule, edits without schedule change the room's own blocks, not the house
        blocks; reading them back with get_blocks needs schedule: room.
      required: false
      example: house
      selector:
        select:
          options:
            - room
            - house
    day:
      name: Day
      description: Day of week the block belongs to
      required: true
      example: monday
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    start_time:
      name: Start Time
      description: Block start time (HH:MM)
      required: true
      example: "07:00"
      selector:
        text:
    end_time:
      name: End Time
      description: Block end time (HH:MM), after start time, minimum 30 minutes
      required: true
      example: "09:00"
      selector:
        text:
    temperature:
      name: Temperature
      description: Target temperature for the block (5 to 35, 0.5 steps)
      required: true
      example: 20.5
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    occupied_temperature:
      name: Occupied Temperature
      description: >
        Optional temperature used instead of temperature while the house occupancy
        entity is on (5 to 35, 0.5 steps). Omit or set to null for none.
      required: false
      example: 21.5
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    block_id:
      name: Block ID
      description: ID of an existing block to update. Omit to create a new block.
      required: false
      example: a1b2c3d4
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether the block is active (default true)
      required: false
      example: true
      selector:
        boolean:

